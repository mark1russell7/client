# Builds packages/site and publishes it to GitHub Pages at https://mark1russell7.github.io/client/,
# with the shared Pages workflow of the template (reusable-pages.yml, pinned to a commit).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
#
# The workflow starts when CI passes on main, so a commit that fails CI never reaches the site
# (deep dive SITE-10). The shared workflow builds the commit that CI tested, and it builds nothing
# for a failed run, a pull request or a different branch. The build runs the browser smoke test of
# packages/site against the built site before the upload, so a failed test stops the deploy. Only
# the deploy job can write to Pages: the build job runs install scripts, so it gets read access only.
#
# It also starts every three hours. The status page reads the open pull requests and issues from
# GitHub at build time, so the schedule keeps that page current without a push.
# A scheduled run builds the newest commit of main that passed CI (pending: green).
#
# The site has its own Releases page and Status page, so site-pages is off. After each deploy that
# is not scheduled, the job indexnow of the shared workflow sends the URLs of sitemap.xml to the
# IndexNow engines. The key is public by design: the site serves public/<key>.txt.
name: Pages

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A deployment that started finishes: a newer run waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    # The build reads the open pull requests, the issues, their checks and the runs of CI (read
    # access only). The deploy writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@d20d75b11120af71eaf6d2f59385c9cd053fff8b # main
    with:
      # The data of the site comes from the dist/ of every package. The site depends on each package
      # that registers procedures, so `pnpm build` builds the site last. The build renders each page
      # in Chromium (an HTML file for each page, and its Open Graph image), and the smoke test uses it too.
      #
      # The measured numbers of the docs pages come from the newest record of the nightly run of main
      # (packages/site/scripts/measured.ts). With no record, the build unsets SITE_MEASURED_DIR, and each
      # measured block gives its text for GitHub and npm. The site deploys, and the job measured-record
      # below fails, so the missing record stays red.
      build: |
        id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=measured-nightly&per_page=30" \
          --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].id // empty')
        if [ -z "$id" ]; then
          echo "::warning::no artifact measured-nightly of main: the docs pages show no measured numbers"
          unset SITE_MEASURED_DIR
        else
          mkdir -p packages/site/measured
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/measured.zip"
          unzip -o -q "$RUNNER_TEMP/measured.zip" -d packages/site/measured
        fi
        pnpm --filter @procedures/site exec playwright install --with-deps chromium
        pnpm build
        pnpm --filter @procedures/site test:e2e
      out: packages/site/dist
      # SITE_PRERENDER=1: the deploy has the prerendered pages, or the build fails.
      env: '{"SITE_BASE": "/client/", "SITE_URL": "https://mark1russell7.github.io/client/", "SITE_PRERENDER": "1", "SITE_MEASURED_DIR": "measured"}'
      # The status page reads the open pull requests and issues (read access only)
      github-token: true
      pending: green
      site-pages: false
      site-check: true
      # The data stamps of the measured package pages (site-pages freshness): the dated studies of
      # packages/site/data-stamps.json, and a stamp with a limit for each page with measured numbers
      data-stamps: packages/site/dist/data/data-stamps.json
      indexnow-key: 626da9a7ba19ca53f2437cb462de76e7
      timeout-minutes: 25

  # The strict read of the measured record. The build above deploys without a record, so this job
  # keeps a missing record red: no nightly run of main yet, a failed nightly, or an expired artifact.
  measured-record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: The newest record of the nightly run of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=measured-nightly&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].id // empty')
          if [ -z "$id" ]; then echo "::error::no artifact measured-nightly of main: the nightly run wrote no record"; exit 1; fi
          echo "The record of the measured numbers is the artifact $id"
