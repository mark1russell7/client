name: Server request

# The time of one synthetic request of the procedures server at one commit, and the share of the
# exec calls in it (roadmap O90). The 9 cases change the bytes of the input and of the result, and
# the record has a fit of the transport time per byte (O94). One job builds @procedures/server and its dependencies, then
# starts scripts/server-request.ts. Each sample is a fresh process for one case and one arm:
# a request over loopback to its own fresh host of runProcedureHost(), or the same exec on
# LocalTransport. measureIsolated() of scripts/lib/paired-time.ts runs the rounds, in mode fresh.
# No record of real traffic exists (O91), thus the requests are synthetic.
#
# With the input profile (two cases, for example chain-200,chain-1), the job does no timed rounds.
# It runs the profile mode of the script (O94): a CPU profile of a fresh host child for each case,
# after the same warm-up and for the same count of calls, then the excess self time of each function.
# The artifact server-request-profile has the profiles and the analysis.
#
# The workflow only reports: only a dispatch starts it, and no ruleset needs its checks.

on:
  workflow_dispatch:
    inputs:
      head:
        description: "The commit or ref to measure (empty: the HEAD of main)"
        required: false
        default: ""
      rounds:
        description: "The rounds: one fresh process for each case and arm in each round (20 or more)"
        required: false
        default: "20"
      profile:
        description: "The profile mode: two cases, for example chain-200,chain-1 (empty: the timed rounds)"
        required: false
        default: ""
      profile_calls:
        description: "The calls in each profile, after 1000 untimed calls (the profile mode only)"
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: server-request-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Server request
    runs-on: ubuntu-latest
    # One install and build of @procedures/server and its dependencies, then about 10 minutes of rounds
    # at 20 rounds: 9 cases, each sample about as long as a sample of chain-50 (4.5 times the 2 cases of O90)
    timeout-minutes: 60
    steps:
      # The script of the run comes from the ref of the workflow. The tree under test is a worktree.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Resolve the head, and check it out
        env:
          HEAD_INPUT: ${{ inputs.head }}
        run: |
          head=$(git rev-parse --verify "${HEAD_INPUT:-origin/main}^{commit}")
          echo "HEAD=$head" >> "$GITHUB_ENV"
          echo "Head $head ($(git log -1 --format='%cs %s' "$head"))"
          git worktree add --detach "$RUNNER_TEMP/trees/head" "$head"
      # The script of the run imports rigor-statistics, a devDependency of the root
      - name: Install the root of the checkout
        run: pnpm install --frozen-lockfile --filter mark1russell7-monorepo
      - name: Install and build the tree
        run: |
          cd "$RUNNER_TEMP/trees/head"
          pnpm install --frozen-lockfile --filter "@procedures/server..."
          pnpm --filter "@procedures/server..." run build
      - name: The requests
        if: ${{ inputs.profile == '' }}
        env:
          ROUNDS: ${{ inputs.rounds || '20' }}
        run: |
          mkdir -p "$RUNNER_TEMP/record"
          node scripts/server-request.ts --tree "$RUNNER_TEMP/trees/head" --ref "$HEAD" --rounds "$ROUNDS" \
            --out "$RUNNER_TEMP/record/server-request.json"
          cat "$RUNNER_TEMP/record/server-request.md" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ always() && inputs.profile == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: server-request
          path: ${{ runner.temp }}/record
          retention-days: 30
      - name: The profile
        if: ${{ inputs.profile != '' }}
        env:
          PROFILE: ${{ inputs.profile }}
          PROFILE_CALLS: ${{ inputs.profile_calls || '1000' }}
        run: |
          mkdir -p "$RUNNER_TEMP/profile"
          node scripts/server-request.ts --tree "$RUNNER_TEMP/trees/head" --ref "$HEAD" \
            --profile "$PROFILE" --profile-calls "$PROFILE_CALLS" --profile-out "$RUNNER_TEMP/profile"
          cat "$RUNNER_TEMP/profile/server-request-profile.md" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ always() && inputs.profile != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: server-request-profile
          path: ${{ runner.temp }}/profile
          retention-days: 30
