name: Check flips

# The flip tests of the checks of ci.yml that hold a measure (roadmap CLI-100): a clean copy passes
# and one fault fails the check. scripts/check-flips.ts gives the details. The checks are the
# coverage floors, the three size budgets of the site and the end of a live key at a close.
#
# A dispatch or the weekly schedule starts this workflow, so a check that loses its power to fail
# shows up within a week. No ruleset needs its checks. A red run is a finding about a check.

on:
  workflow_dispatch:
    inputs:
      prediction:
        description: The id of the prediction that this run scores. Empty for a run with no prediction.
        required: false
        default: ""
      only:
        description: The one flip that this run starts. Empty for each flip.
        required: false
        default: ""
  schedule:
    - cron: "5 5 * * 1"

permissions:
  contents: read

concurrency:
  group: check-flips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Flip of the coverage floor
    if: inputs.only == '' || inputs.only == 'coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@procedures/access..." build
      - run: node scripts/check-flips.ts coverage --out check-flips-coverage.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-flips-coverage
          path: check-flips-coverage.json
          retention-days: 90

  live-close:
    name: Flip of the end of a live key at a close
    if: inputs.only == '' || inputs.only == 'live-close'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@procedures/peer^..." build
      - run: node scripts/check-flips.ts live-close --out check-flips-live-close.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-flips-live-close
          path: check-flips-live-close.json
          retention-days: 90

  size:
    name: Flips of the size budgets
    if: inputs.only == '' || inputs.only == 'size'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read access only: the status page reads the open pull requests and issues of the repository
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history and the tags: the Releases section of the status page reads the date
          # of each version from git, as the Pages workflow does
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @procedures/site exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          SITE_PRERENDER: "1"
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/check-flips.ts size --out check-flips-size.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-flips-size
          path: check-flips-size.json
          retention-days: 90
