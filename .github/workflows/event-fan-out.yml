name: Event fan-out

# The longest block of the event loop and the delivery time of one publish at 1,000, 10,000 and
# 100,000 subscribers, with and without the slices of the event bus (roadmap CLI-90). Each sample is
# a fresh process. Each job has an A/A pair. The report pools the jobs.
#
# The times are a report. The growth of the time of a publish is a gate (bench/fan-out-growth.ts): less than 15 times
# for each 10 times more subscribers.

on:
  workflow_dispatch:
    inputs:
      prediction:
        description: The id of the prediction that this run scores.
        required: true
        type: string
      runs:
        description: The jobs, from 1 to 9. Five or more for a limit.
        type: string
        default: "5"
      rounds:
        description: The rounds of each job, 6 or more for the interval of a case.
        type: string
        default: "6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - name: Plan the jobs
        id: plan
        env:
          RUNS: ${{ inputs.runs }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          [[ "$RUNS" =~ ^[1-9]$ ]] || { echo "runs must be a number from 1 to 9, not $RUNS"; exit 1; }
          [[ "$ROUNDS" =~ ^[0-9]+$ ]] && (( ROUNDS >= 6 )) || { echo "rounds must be 6 or more, not $ROUNDS"; exit 1; }
          echo "runs=[$(seq -s, 1 "$RUNS")]" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: event fan-out (job ${{ matrix.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter mark1russell7-monorepo --filter "@procedures/client..."
      - name: Run the job
        working-directory: packages/client
        env:
          JOB: ${{ matrix.job }}
          ROUNDS: ${{ inputs.rounds }}
        run: node --import tsx bench/fan-out-run.ts --job "$JOB" --rounds "$ROUNDS" --out "bench-out/job-$JOB.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-fan-out-job-${{ matrix.job }}
          path: packages/client/bench-out/job-${{ matrix.job }}.json
          if-no-files-found: error

  report:
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter mark1russell7-monorepo --filter "@procedures/client..."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: event-fan-out-job-*
          merge-multiple: true
          path: packages/client/bench-out
      - name: Pool the jobs
        working-directory: packages/client
        env:
          RUN: ${{ github.run_id }}
          PREDICTION: ${{ inputs.prediction }}
        run: |
          node --import tsx bench/fan-out-report.ts --jobs bench-out --out fan-out-report.json --run "$RUN"
          { echo "Prediction: $PREDICTION"; echo '```json'; cat fan-out-report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-fan-out-report
          path: packages/client/fan-out-report.json
          if-no-files-found: error
      # The growth gate: less than 15 times for each 10 times more subscribers. A no read is not a pass.
      - name: The growth gate
        working-directory: packages/client
        run: node --import tsx bench/fan-out-gate.ts --report fan-out-report.json
