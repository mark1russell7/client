# The WS and WST cells of the harness of systems, on the procedures subject of this checkout
# (CLI-33, decision D16). The harness builds the subject image from this checkout
# (harness/procedures-subject), thus each commit gets a test with no registry.
#
#   plan      Checks the inputs and gives the list of the shards.
#   cells     Checks out systems at SYSTEMS_REF, and runs the cells whose names match `only` on the
#             subject of this checkout, one shard on each runner. Each shard uploads its raw records
#             and its summary.ndjson as an artifact.
#   verdicts  Writes the table of the verdicts. A cell that fails or that is inconclusive fails it.
#
# The cells measure times, thus they run only on GitHub's runners, each shard on a runner of its
# own. This workflow does not start on a push: it is heavy. It starts each night, by hand, and on a
# pull request that changes the subject, this workflow or the WebSocket code of the client.
#
# Start it with: gh workflow run harness.yml -f only='^WS ' -f shards=4
name: Harness

on:
  workflow_dispatch:
    inputs:
      only:
        description: A regular expression of the cell names to run (^WS gives the WS and the WST cells)
        default: "^WS"
      shards:
        description: How many runners share the cells (1 to 20)
        default: "4"
      systems:
        description: A commit of systems to run in place of SYSTEMS_REF (empty for SYSTEMS_REF)
        default: ""
  schedule:
    - cron: "50 4 * * *"
  pull_request:
    paths:
      - "harness/procedures-subject/**"
      - "packages/client/src/adapters/websocket/**"
      - ".github/workflows/harness.yml"
      - ".github/scripts/harness-verdicts.mjs"

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The commit of mark1russell7/systems whose harness and cells run. Change it by hand to take a
  # newer harness: the cells run from the source of the repository, not from npm.
  SYSTEMS_REF: 00ff1eadee6d6892d3b3f48ea282d3c7a75b037a

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      count: ${{ steps.shards.outputs.count }}
      systems: ${{ steps.systems.outputs.ref }}
    steps:
      - id: shards
        env:
          SHARDS: ${{ inputs.shards || '4' }}
        run: |
          case "$SHARDS" in
            ''|*[!0-9]*) echo "::error::shards must be a whole number"; exit 1 ;;
          esac
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then
            echo "::error::shards must be 1 to 20"; exit 1
          fi
          echo "count=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "list=$(seq -s, 0 $((SHARDS - 1)) | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"
      - id: systems
        env:
          GIVEN: ${{ inputs.systems }}
        run: |
          ref="${GIVEN:-$SYSTEMS_REF}"
          case "$ref" in
            *[!0-9a-f]*|'') echo "::error::systems must be a full commit SHA (40 hex digits)"; exit 1 ;;
          esac
          if [ "${#ref}" -ne 40 ]; then echo "::error::systems must be a full commit SHA (40 hex digits)"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  cells:
    needs: plan
    strategy:
      fail-fast: false
      # At most 3 runners at one time: the runner slots of the account are a budget (2026-10-30)
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    # each shard builds the images of the harness (the Rust one among them), then runs its cells
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: client
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mark1russell7/systems
          ref: ${{ needs.plan.outputs.systems }}
          path: systems
          persist-credentials: false
      # The pnpm version comes from "packageManager" in the package.json of systems
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: systems/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: systems/pnpm-lock.yaml
      - name: Install systems
        working-directory: systems
        run: pnpm install --frozen-lockfile
      - name: The runner, beside the records
        env:
          CLIENT_SHA: ${{ github.sha }}
          SYSTEMS_SHA: ${{ needs.plan.outputs.systems }}
        run: |
          mkdir -p "$RUNNER_TEMP/cells"
          {
            echo "client: $CLIENT_SHA"
            echo "systems: $SYSTEMS_SHA"
            echo "kernel: $(uname -r)"
            echo "CONFIG_HZ: $(grep -E '^CONFIG_HZ=' "/boot/config-$(uname -r)" || echo unknown)"
            echo "CLOCK_MONOTONIC_COARSE: $(python3 -c 'import time; print(time.clock_getres(6))') s"
            echo "cpus: $(nproc)"
            echo "cpu: $(lscpu | sed -n 's/^Model name: *//p' | head -n 1)"
            echo "memory: $(free -m | awk '/^Mem:/ {print $2}') MiB"
            echo "image: $ImageOS $ImageVersion"
            docker version --format 'docker: {{.Server.Version}}'
          } | tee "$RUNNER_TEMP/cells/runner.txt"
      # The router of a middlebox lists the conntrack table each 50 to 100 ms. A listing walks each
      # bucket of the table with the softirqs off, and a segment that comes in that walk waits for
      # its end. The cells.yml of systems gives the table 16384 buckets for that reason: this job does the same.
      - name: A small conntrack table
        run: |
          sudo apt-get install -y -qq conntrack >/dev/null
          sudo modprobe nf_conntrack
          before="$(sudo cat /sys/module/nf_conntrack/parameters/hashsize)"
          echo 16384 | sudo tee /sys/module/nf_conntrack/parameters/hashsize >/dev/null
          echo "conntrack buckets: $before, then $(sudo cat /sys/module/nf_conntrack/parameters/hashsize)" | tee -a "$RUNNER_TEMP/cells/runner.txt"
      # The subject of harness/procedures-subject/subject.json, with the context at this checkout
      - name: The subject of this checkout
        run: |
          jq --arg context "$GITHUB_WORKSPACE/client" '.image.context = $context' client/harness/procedures-subject/subject.json > "$RUNNER_TEMP/subject.json"
          echo "subject: $(jq -c . "$RUNNER_TEMP/subject.json")" | tee -a "$RUNNER_TEMP/cells/runner.txt"
      - name: The cells
        working-directory: systems
        env:
          CELLS: "1"
          # the nightly schedule and a pull request have no inputs: they run the WS and the WST cells
          CELLS_ONLY: ${{ inputs.only || '^WS' }}
          CELLS_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
          CELLS_OUT: ${{ runner.temp }}/cells
        run: |
          CELLS_SUBJECT="$(cat "$RUNNER_TEMP/subject.json")"
          export CELLS_SUBJECT
          # the bands of the catalogs read the HZ of the kernel of the runner
          CELLS_HZ="$(sed -n 's/^CONFIG_HZ=//p' "/boot/config-$(uname -r)")"
          if [ -z "$CELLS_HZ" ]; then echo "::error::the runner's kernel config gives no CONFIG_HZ"; exit 1; fi
          export CELLS_HZ
          pnpm --filter @systems/cells exec vitest run src/run.test.ts
      # the error of a failed build holds its error lines and its last lines: this step gives the whole log
      - name: The build of the subject, after a failure
        if: failure()
        working-directory: client
        run: |
          docker build --progress=plain -f harness/procedures-subject/Dockerfile . > /tmp/build.log 2>&1 && echo "the subject builds" || tail -n 120 /tmp/build.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cells-${{ matrix.shard }}
          path: ${{ runner.temp }}/cells/
          if-no-files-found: warn
          retention-days: 30

  verdicts:
    needs: [plan, cells]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cells-*
          path: ${{ runner.temp }}/cells
      - name: The verdicts
        env:
          SHARDS: ${{ needs.plan.outputs.count }}
        run: node .github/scripts/harness-verdicts.mjs "$RUNNER_TEMP/cells" "$SHARDS"
