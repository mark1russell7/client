# The pnpm-lock.yaml of a branch, made again on a runner by the shared workflow reusable-lockfile.yml of
# the template (its CI.md). A dependency update then does not need a local install:
#
#   gh workflow run lockfile.yml --ref <branch>
#   gh run download <run id> -n lockfile -D <folder>
#
# The job merges main into the branch with no commit, then starts `pnpm install --lockfile-only
# --ignore-scripts`. The artifact "lockfile" has pnpm-lock.yaml and merge.txt with the commit of main.
# Merge that commit into the branch, copy the file, and commit it. The job "Repository checks" of ci.yml
# then does a frozen install of that commit.
#
# GitHub dispatches this file only from main. The branch must also have the file: merge main into it.
# A pull request that changes this file starts the job on its own merge commit: that run tests the caller.
name: Lockfile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/lockfile.yml

permissions: {}

# One run for each branch: a new start cancels the older one
concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    uses: mark1russell7/template/.github/workflows/reusable-lockfile.yml@2c041957ca014e4c95a92e2301d249b6b25d2c4f # main
    permissions:
      contents: read
