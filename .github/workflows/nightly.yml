name: Nightly

# The long checks of stage 3 of the testing program (roadmap R32). They run each night and by
# hand. A push does not start them: the CI workflow has the fast checks.
on:
  schedule:
    # Its own minute: a scheduled heavy run of another repo uses none of the minutes near it
    # (the runner budget of 2026-10-30).
    - cron: "28 2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "The jobs to run, for example mutation,windows (empty: all of them but coverage)"
        required: false
        default: ""
      runs:
        description: "The runs of the soak and of coverage, as a JSON list. [1,2,3,4,5] gives the spread (O85)"
        required: false
        default: "[1]"

permissions:
  contents: read
  # The benchmark job reads the artifact of the last nightly run
  actions: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation tests (Stryker)
    if: ${{ !inputs.only || contains(inputs.only, 'mutation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The resolver of references, the capabilities, the expose rule and the middleware
      # (packages/client/stryker.config.mjs). A score below `thresholds.break` of that file
      # makes Stryker exit with code 1, so it fails the run.
      - run: pnpm --filter @procedures/client exec stryker run
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: packages/client/reports/mutation
          retention-days: 30

  bench:
    name: Benchmarks
    if: ${{ !inputs.only || contains(inputs.only, 'bench') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @procedures/client exec vitest bench --run --dir bench
      # The copies of InMemoryStorage (the contract of CollectionStorage): with copies and with
      # the option copies: false
      - run: pnpm --filter @procedures/collections exec vitest bench --run --dir bench
      # The two engines of SqliteStorage in a file (node:sqlite and sql.js): 1,000 writes and a
      # read of 10,000 items
      - run: pnpm --filter @procedures/sqlite exec vitest bench --run --dir bench
      # A full pull of HybridStorage with 1,000 items: the local ids with and without getIds()
      - run: pnpm --filter @procedures/store exec vitest bench --run --dir bench
      # The earlier results come from the last successful nightly run with the four artifacts of
      # benchmark results. A run without them is not a candidate: a dispatch with `only` and
      # without bench, or an older run (O84). Before, such a run made the downloads fail. Without
      # a candidate, the comparison only shows the times, with a notice. When the step finds a run
      # and a download fails, the step fails. Without that rule, the comparison has no earlier
      # results and passes. The comparison only reports (--report-only): a slower benchmark gives a
      # warning. Two different runners give no verdict (the strategist, item O82).
      - name: Find the last nightly run with benchmark results
        id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --status success --limit 50 --json databaseId --jq '.[].databaseId'); do
            names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")')
            missing=0
            for name in bench-results bench-results-collections bench-results-sqlite bench-results-store; do
              [[ " $names " == *" $name "* ]] || missing=1
            done
            if [ "$missing" = 0 ]; then
              run_id=$id
              break
            fi
          done
          echo "Earlier run: ${run_id:-none}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Compare with the last nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          run_id: ${{ steps.earlier.outputs.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/earlier"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name bench-results --dir "$RUNNER_TEMP/earlier" \
              || { echo "::error title=Earlier benchmarks::The download of bench-results of run $run_id failed"; exit 1; }
          else
            echo "::notice title=Earlier benchmarks::No earlier successful nightly run: bench-results has no earlier results"
          fi
          node scripts/bench-compare.mjs "$RUNNER_TEMP/earlier" packages/client/bench/results --factor 2 --report-only
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: packages/client/bench/results
          retention-days: 30
      - name: Compare the storage benchmarks with the last nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          run_id: ${{ steps.earlier.outputs.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/earlier-collections"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name bench-results-collections --dir "$RUNNER_TEMP/earlier-collections" \
              || { echo "::error title=Earlier benchmarks::The download of bench-results-collections of run $run_id failed"; exit 1; }
          else
            echo "::notice title=Earlier benchmarks::No earlier successful nightly run: bench-results-collections has no earlier results"
          fi
          node scripts/bench-compare.mjs "$RUNNER_TEMP/earlier-collections" packages/client-collections/bench/results --factor 2 --report-only
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-collections
          path: packages/client-collections/bench/results
          retention-days: 30
      - name: Compare the SQLite and HybridStorage benchmarks with the last nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          run_id: ${{ steps.earlier.outputs.run_id }}
        run: |
          for name in sqlite store; do
            mkdir -p "$RUNNER_TEMP/earlier-$name"
            if [ -n "$run_id" ]; then
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "bench-results-$name" --dir "$RUNNER_TEMP/earlier-$name" \
                || { echo "::error title=Earlier benchmarks::The download of bench-results-$name of run $run_id failed"; exit 1; }
            else
              echo "::notice title=Earlier benchmarks::No earlier successful nightly run: bench-results-$name has no earlier results"
            fi
          done
          node scripts/bench-compare.mjs "$RUNNER_TEMP/earlier-sqlite" packages/client-sqlite/bench/results --factor 2 --report-only
          node scripts/bench-compare.mjs "$RUNNER_TEMP/earlier-store" packages/client-store/bench/results --factor 2 --report-only
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-sqlite
          path: packages/client-sqlite/bench/results
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-store
          path: packages/client-store/bench/results
          retention-days: 30

  soak:
    name: WebSocket and HTTP soak (10 minutes each)
    # bench, soak and live run one after the other, so that the nightly holds at most 3 runners.
    # A skipped or failed job before does not stop the next one.
    needs: bench
    if: ${{ !cancelled() && (!inputs.only || contains(inputs.only, 'soak')) }}
    runs-on: ubuntu-latest
    # Two soaks of 10 minutes, one after the other, and the install and the build
    timeout-minutes: 45
    # The input `runs` gives more than one soak: the limits of soak.test.ts come from 5 runs (O85)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: ${{ fromJSON(inputs.runs || '[1]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The WebSocket soak, then the HTTP soak with its keep-alive lines.
      # --expose-gc: the tests measure the heap after a collection.
      # Each soak writes its measured values as one line `soak-measure <transport> {json}`. The
      # artifact soak-measure-<run> keeps these lines.
      - run: pnpm --filter @procedures/client exec vitest run src/soak.test.ts | tee "$RUNNER_TEMP/soak.log"
        shell: bash
        env:
          SOAK_MINUTES: "10"
          NODE_OPTIONS: --expose-gc
      - if: always()
        run: grep -o 'soak-measure .*' "$RUNNER_TEMP/soak.log" > "$RUNNER_TEMP/soak-measure.txt" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-measure-${{ matrix.run }}
          path: ${{ runner.temp }}/soak-measure.txt
          retention-days: 30

  live:
    name: Real MongoDB and Docker
    needs: soak
    if: ${{ !cancelled() && (!inputs.only || contains(inputs.only, 'live')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The mongo.* procedures against MongoDB 7
        run: pnpm --filter @procedures/mongo exec vitest run src/live.test.ts
        env:
          LIVE_MONGO: "1"
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: procedures_live
      - name: The docker.* procedures and the docker CLI against the Docker of the runner
        run: pnpm --filter @procedures/docker exec vitest run __tests__/procedures.integration.test.ts __tests__/docker.integration.test.ts
        env:
          LIVE_DOCKER: "1"

  windows:
    name: Windows (Node 24)
    if: ${{ !inputs.only || contains(inputs.only, 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # `lib new` runs cue-config, which needs the CUE binary (the scaffold test of mark)
      - name: Install CUE
        run: |
          # The SHA-256 that GitHub records for the release asset (CUE publishes no checksums.txt for v0.15.1)
          curl -fsSL -o "$RUNNER_TEMP/cue.zip" https://github.com/cue-lang/cue/releases/download/v0.15.1/cue_v0.15.1_windows_amd64.zip
          echo "516fa080c1af12578ff76a4165cc7bf14ad9bbe5d9724a0c07553860d038885e  $RUNNER_TEMP/cue.zip" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/cue.zip" cue.exe -d "$RUNNER_TEMP/cue"
          echo "$RUNNER_TEMP/cue" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The typecheck of each package also examines its tests (tsconfig.test.json)
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @procedures/mark test:e2e

  # The coverage check of the CI workflow, once for each item of the input `runs` (roadmap O85).
  # The runs show the spread of the coverage, and the floors of coverage-baseline.json come from
  # them. Only a dispatch with `only` that names coverage starts it: the CI workflow has the check.
  coverage:
    name: Coverage run ${{ matrix.run }}
    if: ${{ contains(inputs.only, 'coverage') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: ${{ fromJSON(inputs.runs || '[1]') }}
    # The same MongoDB as the coverage job of ci.yml
    env:
      MONGO_TEST_URL: mongodb://localhost:27017/?directConnection=true
      MONGO_TEST_TOPOLOGY: replica-set
      MONGO_TEST_FAILPOINTS: "1"
    steps:
      - name: Start MongoDB 7 (a single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
          for i in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 60); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done
          [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # The scaffold test of mark runs cue-config, which needs the CUE binary
      - name: Install CUE
        run: |
          # The SHA-256 that GitHub records for the release asset (CUE publishes no checksums.txt for v0.15.1)
          curl -fsSL -o "$RUNNER_TEMP/cue.tar.gz" https://github.com/cue-lang/cue/releases/download/v0.15.1/cue_v0.15.1_linux_amd64.tar.gz
          echo "aa282261245e9ab0d65b17ec3c7207f5231600106f7b26fc0c2e158b3937ca3f  $RUNNER_TEMP/cue.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cue.tar.gz" -C "$RUNNER_TEMP" cue
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/coverage.mjs --totals "$RUNNER_TEMP/coverage-totals.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-totals-${{ matrix.run }}
          path: ${{ runner.temp }}/coverage-totals.json
          retention-days: 30

  # The lowest value, the highest value and the spread of each metric across the coverage runs,
  # and the floors: the lowest value minus the spread, rounded down to 0.1 (scripts/coverage-spread.mjs, O88)
  coverage-spread:
    name: The spread of the coverage runs
    needs: coverage
    if: ${{ !cancelled() && contains(inputs.only, 'coverage') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-totals-*
          path: ${{ runner.temp }}/totals
      - run: node scripts/coverage-spread.mjs "$RUNNER_TEMP/totals" --out "$RUNNER_TEMP/coverage-spread-floors.json" | tee "$RUNNER_TEMP/coverage-spread.txt"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-spread
          path: |
            ${{ runner.temp }}/coverage-spread.txt
            ${{ runner.temp }}/coverage-spread-floors.json
          retention-days: 30
