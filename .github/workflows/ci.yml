name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to a branch cancels its older run. Each commit of main keeps its run, so each
# commit of main gets a result, and the Pages workflow can start after it (deep dive SITE-10).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The shared CI of mark1russell7 (reusable-ci.yml of the template, its CI.md), on Node 22, 24
  # and 26: the lowest Node version that the root package.json allows, the active LTS and the
  # current one. Renovate moves the pin to the newest commit of the template main (the comment).
  # The check names are "CI / checks (ubuntu-latest, node <version>)".
  ci:
    name: CI
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@7af3bb92e5d5d290cdfe066f2db9d4e3dcf50cdd # main
    with:
      # Build first: each package builds dist/ with `tsc -b`, and dependents read the types from
      # dist/. lint:ste examines the writing rules (ASD-STE100) of the README files and the doc comments.
      scripts: build typecheck test lint:ste
      node-versions: '["22", "24", "26"]'
      timeout-minutes: 25
      # `lib new` runs cue-config, which needs the CUE binary (the scaffold test of mark). The
      # SHA-256 is the one that GitHub records for the release asset (CUE publishes no
      # checksums.txt for v0.15.1).
      setup: |
        curl -fsSL -o "$RUNNER_TEMP/cue.tar.gz" https://github.com/cue-lang/cue/releases/download/v0.15.1/cue_v0.15.1_linux_amd64.tar.gz
        echo "aa282261245e9ab0d65b17ec3c7207f5231600106f7b26fc0c2e158b3937ca3f  $RUNNER_TEMP/cue.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/cue.tar.gz" -C "$RUNNER_TEMP" cue
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # On each Node version, after the scripts:
      # - The types of the test files. The presets of cue exclude the test files from `pnpm typecheck`.
      # - The built mark CLI as a process: help, commands, lib new, mcp and serve. A missing build
      #   fails the run (roadmap R8: before, CI did not start these tests).
      run: |
        node .github/scripts/typecheck-tests.mjs
        pnpm --filter @procedures/mark test:e2e

  # The changesets of a pull request (strategy s38, decision D13): changeset-check of the template
  # fails a change of a published package without a changeset, a changeset of an unknown package,
  # and a "major" of a 0.x package. The version PR, an empty changeset and the label no-changeset pass.
  changesets:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: mark1russell7/template/.github/actions/changeset-check@7af3bb92e5d5d290cdfe066f2db9d4e3dcf50cdd # main

  # The checks of this repository, once, on Node 26. They need the build, but not each Node version.
  checks:
    name: Repository checks (catalogs, scope, imports, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # PROCEDURES.md and PACKAGES.md come from the built registry (roadmap R47: before, they
      # drifted). A difference fails the run, and the new files are an artifact: commit them.
      - name: The generated catalogs are current
        run: |
          node packages/documentation/scripts/generate-procedures.mjs
          node packages/documentation/scripts/generate-packages.mjs
          git diff --stat --exit-code packages/documentation/PROCEDURES.md packages/documentation/PACKAGES.md
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-catalogs
          path: |
            packages/documentation/PROCEDURES.md
            packages/documentation/PACKAGES.md
          retention-days: 7
      # Each public package has a report of its public API in test/api/public-api.txt (roadmap R30,
      # CLI-86). The reports come from the built .d.ts files. A changed or new report fails the run, and
      # the reports are an artifact: review the diff, then commit them. First the tests of the tool,
      # then the tool. A plain git diff does not show a new report, so the step reads git status. The
      # pathspec names the files: git does not match a folder with a * against the files in it.
      - name: The reports of the public API are current
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/api-report.test.mjs
          status=0
          node scripts/api-report.mjs --update || status=$?
          changed="$(git status --porcelain --untracked-files=all -- 'packages/*/test/api/public-api.txt')"
          if [ -n "$changed" ]; then
            echo "These reports differ from the built .d.ts files, or are new:"
            echo "$changed"
            git --no-pager diff --stat -- 'packages/*/test/api/public-api.txt'
            echo "::error title=Public API reports::Download the artifact public-api-reports, review the diff and commit the reports. Or start pnpm build, then node scripts/api-report.mjs --update."
            status=1
          fi
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-api-reports
          path: packages/*/test/api/public-api.txt
          retention-days: 7
      # No file names a package of this repository with the old scope @mark1russell7 (2026-10-12)
      - name: Check the package scope
        if: ${{ !cancelled() }}
        run: node scripts/check-scope.mjs
      # Importing a package registers nothing: only its ./register entry does (2026-10-13, P9)
      - name: Check the side effects of the imports
        if: ${{ !cancelled() }}
        run: node scripts/check-side-effects.mjs
      # The browser entries (`client.browser` of each package.json) reach no Node built-in, with
      # or without the prefix node: (CLI-39). First the tests of the check, then the check.
      - name: Check the browser entries
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-browser-entries.test.mjs
          node scripts/check-browser-entries.mjs
      # Each package that an entry of a published package imports (its exports map and its bins)
      # is in its dependencies, peerDependencies or optionalDependencies. A strict install (pnpm)
      # finds no other package, and the tests here do not show it (CLI-63). First the tests of the
      # check, then the check.
      - name: Check the declared imports
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-declared-imports.test.mjs
          node scripts/check-declared-imports.mjs
      # The paths, the topics and the storage writes (invariants I3 and I5, CLI-84). A path, a key, a
      # method or a topic goes through the codec of @procedures/client, and not through a join or a
      # split on ".". Only the storage files write a MongoDB collection. The step parses the src/
      # folders, so it does not need the build. First the tests of the check, then the check.
      - name: Check the paths, topics and storage writes
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-paths-and-writes.test.mjs
          pnpm check:paths-and-writes
      # The import boundaries of invariant I9 (CLI-83), with dependency-cruiser: a transport does not
      # import the server, an import of another package goes through an entry of its exports map, and
      # no package imports an app. The rules are in scripts/lib/boundaries.cjs. They read dist/, so
      # they need the build. First the tests of the rules, then the check.
      - name: Check the import boundaries
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-boundaries.test.mjs
          pnpm check:boundaries
      # Each package against the template of `lib new`. The step reads the JSON result, because
      # `mark` exits with 0 also for `success: false` (deep dive CLI-8). A procedure without
      # metadata.effects is a warning annotation: it does not fail the step.
      - name: Audit the packages
        if: ${{ !cancelled() }}
        run: |
          node packages/mark/dist/cli.js lib audit > "$RUNNER_TEMP/audit.json"
          node -e '
            const result = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            console.log(JSON.stringify(result.summary));
            const issues = result.procedureIssues ?? [];
            console.log(issues.length + " procedure issues (warnings)");
            for (const issue of issues) console.log("::warning title=lib audit " + issue.type + "::" + issue.message);
            if (!result.success) {
              for (const pkg of result.results ?? []) if (!pkg.valid) console.log(JSON.stringify(pkg));
              process.exit(1);
            }
          ' "$RUNNER_TEMP/audit.json"

  mongo:
    # MongoDocumentStorage against a real MongoDB (roadmap CLI-24): the CollectionStorage contract,
    # the partitions, the documents and the change log, on both topologies. On a replica set, each
    # write is a transaction; on a single server, the watermark and the release fence keep the log
    # exact. The other jobs run only its pure tests.
    name: MongoDB (the storage contract, ${{ matrix.topology }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        topology: [single-server, replica-set]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start MongoDB 7
        run: |
          if [ "${{ matrix.topology }}" = "replica-set" ]; then
            docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
          else
            docker run -d --name mongo -p 27017:27017 mongo:7
          fi
          for i in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 1
          done
          if [ "${{ matrix.topology }}" = "replica-set" ]; then
            docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
            for i in $(seq 1 60); do
              [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
              sleep 1
            done
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@procedures/mongo..." build
      - name: The storage tests on MongoDB 7 (${{ matrix.topology }})
        env:
          MONGO_TEST_URL: mongodb://localhost:27017/?directConnection=true
          MONGO_TEST_TOPOLOGY: ${{ matrix.topology }}
          # The failpoint tests (for example a transaction over its lifetime limit) need the test commands of the replica set
          MONGO_TEST_FAILPOINTS: ${{ matrix.topology == 'replica-set' && '1' || '' }}
        run: pnpm --filter @procedures/mongo exec vitest run src/storage

  lifecycle:
    # The real hosts stop under run() of @mark1russell7/service (roadmap CI-2). The test starts the
    # built procedure-server and mark --server, and sends SIGTERM in the middle of an NDJSON stream.
    # It examines the in-band end of the stream, the 503 and the refused connection of the drain,
    # the exit code and the time to the exit. It measures times, so it runs only in this job.
    name: Host lifecycle (SIGTERM in a stream)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # mark and its dependencies: @procedures/server, and the procedure packages of mark --server
      - run: pnpm --filter "@procedures/mark..." build
      - name: SIGTERM in the middle of a stream
        run: pnpm --filter @procedures/server exec vitest run --config vitest.e2e.config.ts

  coverage:
    name: Coverage (the floors only go up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The storage and view tests of @procedures/mongo run against this MongoDB, so their coverage
    # counts. A single-node replica set: the materialized views need change streams.
    env:
      MONGO_TEST_URL: mongodb://localhost:27017/?directConnection=true
      MONGO_TEST_TOPOLOGY: replica-set
      MONGO_TEST_FAILPOINTS: "1"
    steps:
      - name: Start MongoDB 7 (a single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
          for i in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 60); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done
          [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # The scaffold test of mark runs cue-config, which needs the CUE binary
      - name: Install CUE
        run: |
          # The SHA-256 that GitHub records for the release asset (CUE publishes no checksums.txt for v0.15.1)
          curl -fsSL -o "$RUNNER_TEMP/cue.tar.gz" https://github.com/cue-lang/cue/releases/download/v0.15.1/cue_v0.15.1_linux_amd64.tar.gz
          echo "aa282261245e9ab0d65b17ec3c7207f5231600106f7b26fc0c2e158b3937ca3f  $RUNNER_TEMP/cue.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cue.tar.gz" -C "$RUNNER_TEMP" cue
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Each package against its floor in coverage-baseline.json (roadmap R31). The raised floors
      # are an artifact: copy them to coverage-baseline.json to raise the floors.
      - run: node scripts/coverage.mjs --allow-missing --out "$RUNNER_TEMP/coverage-floors.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-floors
          path: ${{ runner.temp }}/coverage-floors.json
          retention-days: 30

  package:
    name: Packages (pack, publint, attw, install)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Each public package as npm gives it: the tarball, publint, attw, an install of all the
      # tarballs into an empty project, imports, a program and the bins. Until the general packages
      # (cue, splay, docker-sqlite) are on npm, three packages use github: dependencies
      # (packages/documentation/RELEASE.md). The release workflow does not allow them.
      - run: node scripts/check-packages.mjs

  site:
    name: Site (browser smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Read access only: the status page reads the open pull requests and issues of the repository
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history and the tags: the Releases section of the status page reads the date
          # of each version from git, as the Pages workflow does
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium first: the site build prerenders each page in it, so the tests see the real HTML
      - name: Install Chromium for Playwright
        run: pnpm --filter @procedures/site exec playwright install --with-deps chromium
      # GITHUB_TOKEN: the status page reads GitHub as the Pages build does. Without it (a fork),
      # the page says that the build could not read GitHub, and the tests pass too.
      - run: pnpm build
        env:
          SITE_PRERENDER: "1"
          GITHUB_TOKEN: ${{ github.token }}
      # The examples run, share links round-trip, no page scrolls sideways at 375 px, axe-core,
      # the keyboard, and the code of the TypeScript tab runs with Node
      - run: pnpm --filter @procedures/site test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: packages/site/node_modules/.cache/playwright/results
          retention-days: 7
