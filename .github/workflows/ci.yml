name: CI

# A throw-away branch of roadmap CLI-102: only the row "a write past its lease: no value goes back"
# on a replica set, with more schedules, a seed offset for each shard, and the history of each value
# that goes back. This branch never merges.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  late-order:
    name: Late order (seeds from ${{ matrix.offset }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        offset: [1000, 2000, 3000, 4000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/start-mongo
        with:
          topology: replica-set
          test-commands: "1"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@procedures/mongo..." build
      - name: The late-order row
        env:
          MONGO_TEST_URL: mongodb://localhost:27017/?directConnection=true
          MONGO_TEST_TOPOLOGY: replica-set
          RACE_LATE_SCHEDULES: "96"
          RACE_SEED_OFFSET: ${{ matrix.offset }}
        run: pnpm --filter @procedures/mongo exec node node_modules/vitest/vitest.mjs run src/storage/change-cursor-race.test.ts -t "a write past its lease: no value goes back"
