name: CI

# A push to main and each pull request. A push to the branch of a pull request starts only the
# pull_request run: before, each push started two runs of all jobs (the runner budget of 2026-11-01).
on:
  push:
    branches: [main]
  pull_request:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch cancels its older run. Each commit of main keeps its run, so each
# commit of main gets a result, and the Pages workflow can start after it (deep dive SITE-10).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  # The shared CI of mark1russell7 (reusable-ci.yml of the template, its CI.md), on Node 22, 24
  # and 26: the lowest Node version that the root package.json allows, the active LTS and the
  # current one. Renovate moves the pin to the newest commit of the template main (the comment).
  # The check names are "CI / checks (ubuntu-latest, node <version>)".
  ci:
    name: CI
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@33b21ee9ded1c22a99baf1a71b187160012d3695 # main
    with:
      # Build first: each package builds dist/ with `tsc -b`, and dependents read the types from
      # dist/. The types and the writing rules do not change with the Node version, so the job
      # checks (Node 26) runs typecheck and lint:ste once, not on each Node version.
      scripts: build test
      node-versions: '["22", "24", "26"]'
      timeout-minutes: 25
      # `lib new` runs cue-config, which needs the CUE binary (the scaffold test of mark). The
      # shared action setup-cue installs it from a cache, or from the release with retries.
      cue-version: "0.15.1"
      # The script typecheck of each package also type-checks its tests with tsconfig.test.json
      # (the test feature of cue 1.1.0), so `pnpm typecheck` of the job checks examines them.
      # On each Node version, after the scripts: the built mark CLI as a process: help, commands,
      # lib new, mcp and serve. A missing build fails the run (roadmap R8: before, CI did not start these tests).
      run: |
        pnpm --filter @procedures/mark test:e2e

  # The changesets of a pull request (decision D13): changeset-check of the template
  # fails a change of a published package without a changeset, a changeset of an unknown package,
  # and a "major" of a 0.x package. The version PR, an empty changeset and the label no-changeset pass.
  changesets:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: mark1russell7/template/.github/actions/changeset-check@33b21ee9ded1c22a99baf1a71b187160012d3695 # main

  # The checks of this repository, once, on Node 26. They need the build, but not each Node version.
  checks:
    name: Repository checks (catalogs, imports, packages, lifecycle, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole history: the rule release-files of check:conventions reads each commit of a pull
      # request back to its merge base. A depth of 2 failed it for a pull request of 2 commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # One time for all Node versions: the types, and the writing rules (ASD-STE100) of the README
      # files and the doc comments.
      - run: pnpm typecheck
      - run: pnpm lint:ste
      # PROCEDURES.md and PACKAGES.md come from the built registry (roadmap R47: before, they
      # drifted). A difference fails the run, and the new files are an artifact: commit them.
      - name: The generated catalogs are current
        run: |
          node packages/documentation/scripts/generate-procedures.ts
          node packages/documentation/scripts/generate-packages.ts
          git diff --stat --exit-code packages/documentation/PROCEDURES.md packages/documentation/PACKAGES.md
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-catalogs
          path: |
            packages/documentation/PROCEDURES.md
            packages/documentation/PACKAGES.md
          retention-days: 7
      # Each public package has a report of its public API in test/api/public-api.txt (roadmap R30,
      # CLI-86). The reports come from the built .d.ts files. A changed or new report fails the run, and
      # the reports are an artifact: review the diff, then commit them. The tool is the package
      # @mark1russell7/api-report. A plain git diff does not show a new report, so the step reads git
      # status, which also shows a report that the tool removed. The pathspec names the files: git does
      # not match a folder with a * against the files in it.
      - name: The reports of the public API are current
        if: ${{ !cancelled() }}
        run: |
          status=0
          pnpm exec api-report update || status=$?
          changed="$(git status --porcelain --untracked-files=all -- 'packages/*/test/api/public-api.txt')"
          if [ -n "$changed" ]; then
            echo "These reports differ from the built .d.ts files, or are new:"
            echo "$changed"
            git --no-pager diff --stat -- 'packages/*/test/api/public-api.txt'
            echo "::error title=Public API reports::Download the artifact public-api-reports, review the diff and commit the reports. Or start pnpm build, then pnpm exec api-report update."
            status=1
          fi
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-api-reports
          path: packages/*/test/api/public-api.txt
          retention-days: 7
      # The shared conventions (@mark1russell7/conventions). The step needs the build:
      # the rule typed-files lists the files of each tsconfig with tsc. The summary of the run has
      # a table of the rules.
      - name: Check the conventions
        if: ${{ !cancelled() }}
        run: pnpm check:conventions
      # No file names a package of this repository with the old scope @mark1russell7 (2026-10-12)
      - name: Check the package scope
        if: ${{ !cancelled() }}
        run: node scripts/check-scope.ts
      # Importing a package registers nothing: only its ./register entry does (2026-10-13, P9)
      - name: Check the side effects of the imports
        if: ${{ !cancelled() }}
        run: node scripts/check-side-effects.ts
      # The browser entries (`client.browser` of each package.json) reach no Node built-in, with
      # or without the prefix node: (CLI-39). First the tests of the check, then the check.
      - name: Check the browser entries
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-browser-entries.test.ts
          node scripts/check-browser-entries.ts
      # Each package that an entry of a published package imports (its exports map and its bins)
      # is in its dependencies, peerDependencies or optionalDependencies. A strict install (pnpm)
      # finds no other package, and the tests here do not show it (CLI-63). First the tests of the
      # check, then the check.
      - name: Check the declared imports
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-declared-imports.test.ts
          node scripts/check-declared-imports.ts
      # The paths, the topics and the storage writes (invariants I3 and I5, CLI-84). A path, a key, a
      # method or a topic goes through the codec of @procedures/client, and not through a join or a
      # split on ".". Only the storage files write a MongoDB collection. The step parses the src/
      # folders, so it does not need the build. First the tests of the check, then the check.
      - name: Check the paths, topics and storage writes
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-paths-and-writes.test.ts
          pnpm check:paths-and-writes
      # The nightly adds the runner context to each benchmark result with scripts/bench-context.ts
      # (O82). The nightly does not run on a pull request, so the tests of the script run here.
      - name: Test the benchmark context script
        if: ${{ !cancelled() }}
        run: node --test scripts/bench-context.test.ts
      # The paired bench (O83, .github/workflows/paired-bench.yml) runs only by hand, so the tests of
      # its scripts and of the copy of paired-time/1 run here. They time no code.
      - name: Test the paired bench scripts
        if: ${{ !cancelled() }}
        run: node --test scripts/paired-time.test.ts scripts/bench-paired.test.ts scripts/setup-profile.test.ts scripts/server-request.test.ts scripts/compile-cache.test.ts scripts/mark-call.test.ts
      # The flips of the measure checks (CLI-100) run only by dispatch and each week, so the tests
      # of their script run here.
      - name: Test the flip script
        if: ${{ !cancelled() }}
        run: node --test scripts/check-flips.test.ts
      # The import boundaries of invariant I9 (CLI-83), with dependency-cruiser: a transport does not
      # import the server, an import of another package goes through an entry of its exports map, and
      # no package imports an app. The shared rules are in the package @mark1russell7/boundaries, and
      # .dependency-cruiser.ts adds the rules of this repository. They read dist/, so they need the
      # build. First the tests of the rules, then the check.
      - name: Check the import boundaries
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-boundaries.test.ts
          pnpm check:boundaries
      # Each package against the template of `lib new`. The step reads the JSON result, because
      # `mark` exits with 0 also for `success: false` (deep dive CLI-8). A procedure without
      # metadata.effects is a warning annotation: it does not fail the step.
      - name: Audit the packages
        if: ${{ !cancelled() }}
        run: |
          node packages/mark/dist/cli.js lib audit > "$RUNNER_TEMP/audit.json"
          node -e '
            const result = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            console.log(JSON.stringify(result.summary));
            if (!result.summary?.total) {
              console.log("::error title=lib audit::The audit examined 0 packages. It expected the packages of packages/ in the workspace.");
              process.exit(1);
            }
            const issues = result.procedureIssues ?? [];
            console.log(issues.length + " procedure issues (warnings)");
            for (const issue of issues) console.log("::warning title=lib audit " + issue.type + "::" + issue.message);
            if (!result.success) {
              for (const pkg of result.results ?? []) if (!pkg.valid) console.log(JSON.stringify(pkg));
              process.exit(1);
            }
          ' "$RUNNER_TEMP/audit.json"

      # The jobs lifecycle, package and coverage were here before roadmap O87: each one repeated the
      # checkout, the install and the build of this job. The ruleset requires only CI OK and
      # Security OK, so these steps feed CI OK through this job. Each one runs also after a
      # failure of an earlier step, so a run shows each failure.

      # Each public package as npm gives it: the tarball, publint, attw, an install of all the
      # tarballs into an empty project, imports, a program and the bins. Until the general packages
      # (cue, splay, docker-sqlite) are on npm, three packages use github: dependencies
      # (packages/documentation/RELEASE.md). The release workflow does not allow them.
      - name: Check the packages (pack, publint, attw, install)
        if: ${{ !cancelled() }}
        run: node scripts/check-packages.ts

      # The real hosts stop under run() of @mark1russell7/service (roadmap CI-2). The test starts the
      # built procedure-server and mark --server, and sends SIGTERM in the middle of an NDJSON stream.
      # It examines the in-band end of the stream, the 503 and the refused connection of the drain,
      # the exit code and the time to the exit. It measures times, so no other step runs with it.
      - name: Stop a host with SIGTERM in a stream
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: pnpm --filter @procedures/server exec vitest run --config vitest.e2e.config.ts

      # The storage and view tests of @procedures/mongo run against this MongoDB, so their coverage
      # counts. A single-node replica set: the materialized views need change streams.
      - name: Start MongoDB 7 for the coverage (a single-node replica set)
        if: ${{ !cancelled() }}
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
          for i in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 60); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done
          [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]
      # The test of s3.upload against a service with a custom endpoint (roadmap CLI-99)
      - name: Start the S3 gateway
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/s3-data"
          docker run -d --name s3-gateway --user "$(id -u):$(id -g)" -p 9000:9000 -v "$RUNNER_TEMP/s3-data:/data" versity/versitygw:v1.10.0 --access test-access --secret test-secret-key --port :9000 posix /data
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000/ && break
            sleep 1
          done
          curl -s -o /dev/null http://localhost:9000/ || { docker logs s3-gateway; exit 1; }
      # The scaffold test of mark runs cue-config, which needs the CUE binary
      # The SHA-256 that GitHub records for the release asset (CUE publishes no checksums.txt for v0.15.1)
      - name: Install CUE for the coverage
        if: ${{ !cancelled() }}
        uses: mark1russell7/template/.github/actions/setup-cue@33b21ee9ded1c22a99baf1a71b187160012d3695 # main
        with:
          version: "0.15.1"
          sha256: aa282261245e9ab0d65b17ec3c7207f5231600106f7b26fc0c2e158b3937ca3f
      # Each package against its floor in coverage-baseline.json (roadmap R31). The raised floors
      # are an artifact: copy them to coverage-baseline.json to raise the floors. A package without
      # a floor fails the step: a pull request that adds a package also adds its floor.
      - name: Coverage (the floors only go up)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          MONGO_TEST_URL: mongodb://localhost:27017/?directConnection=true
          MONGO_TEST_TOPOLOGY: replica-set
          MONGO_TEST_FAILPOINTS: "1"
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_ACCESS_KEY: test-access
          S3_TEST_SECRET_KEY: test-secret-key
        run: node scripts/coverage.ts --out "$RUNNER_TEMP/coverage-floors.json" --reports "$RUNNER_TEMP/coverage"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-floors
          path: ${{ runner.temp }}/coverage-floors.json
          retention-days: 30
      # The reports of each package: coverage-final.json gives the coverage of each function to the
      # code atlas, which reads the artifact "coverage" of main
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
          if-no-files-found: ignore
          retention-days: 30

  mongo:
    # MongoDocumentStorage against a real MongoDB (roadmap CLI-24): the CollectionStorage contract,
    # the partitions, the documents and the change log, on both topologies. On a replica set, each
    # write is a transaction; on a single server, the watermark and the release fence keep the log
    # exact. The other jobs run only its pure tests.
    name: MongoDB (the storage contract, ${{ matrix.topology }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        topology: [single-server, replica-set]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/start-mongo
        with:
          topology: ${{ matrix.topology }}
          test-commands: "1"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@procedures/mongo..." build
      - name: The storage tests on MongoDB 7 (${{ matrix.topology }})
        env:
          MONGO_TEST_URL: mongodb://localhost:27017/?directConnection=true
          MONGO_TEST_TOPOLOGY: ${{ matrix.topology }}
          # The failpoint tests (for example a transaction over its lifetime limit) need the test commands of the replica set
          MONGO_TEST_FAILPOINTS: ${{ matrix.topology == 'replica-set' && '1' || '' }}
        # A failpoint is global to the server, so the files that set one run after the others, one at a time.
        run: pnpm --filter @procedures/mongo exec node --import tsx test/storage-tests.ts src/storage

  # The speed gate of the store (roadmap CLI-94). A pull request that changes the source of the store
  # compares the reads and the writes of its merge with its base on a real MongoDB, with an A/A beside
  # them. Two jobs take 12 rounds. A case with no outcome takes 12 more rounds in each job, and then the
  # gate is final. "No read" is red with its own text: it is not a block and not a pass. The gate holds
  # a slowdown of 25 percent or more in each gated case, and a smaller slowdown can pass. The limit,
  # its CI runs and its formula are in bench/gate-limit.json.
  mongo-speed-plan:
    name: MongoDB (a change of the store)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.store.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # HEAD is the merge of the pull request, and its first parent is the base of that merge
      - name: Find a change of the store
        id: store
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD | grep -E '^packages/client-mongo/(src/|bench/(gate|read-|write-))' | grep -vE '\.test\.tsx?$' || true)
          if [ -n "$changed" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "No file of the store changed, so this gate has nothing to compare."; fi
      # The tests of the verdict come first, because a fault in them makes the 34 minutes of the jobs worth nothing
      - uses: ./.github/actions/store-gate-tools
        if: steps.store.outputs.changed == 'true'
      - name: Test the verdict
        if: steps.store.outputs.changed == 'true'
        run: pnpm --filter @procedures/mongo exec vitest run bench/gate-verdict.test.ts

  mongo-speed:
    name: MongoDB (the speed gate of the store, job ${{ matrix.job }})
    needs: mongo-speed-plan
    if: needs.mongo-speed-plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        job: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/store-gate-job
        with:
          job: ${{ matrix.job }}
          artifact: store-gate-job-${{ matrix.job }}
          out: job-${{ matrix.job }}.json

  mongo-speed-look:
    name: MongoDB (the first look of the speed gate)
    needs: [mongo-speed-plan, mongo-speed]
    if: ${{ !cancelled() && needs.mongo-speed-plan.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      more: ${{ steps.look.outputs.more }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/store-gate-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: store-gate-job-*
          merge-multiple: true
          path: packages/client-mongo/bench-out
      # This step does not end the gate. The job after the second look gives the verdict.
      - name: Find the cases of the next look
        id: look
        working-directory: packages/client-mongo
        run: node --import tsx bench/gate-report.ts --jobs bench-out --out look-report.json --more "$GITHUB_OUTPUT"

  mongo-speed-more:
    name: MongoDB (the second look of the speed gate, job ${{ matrix.job }})
    needs: mongo-speed-look
    if: ${{ !cancelled() && needs.mongo-speed-look.result == 'success' && needs.mongo-speed-look.outputs.more != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        job: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/store-gate-job
        with:
          job: ${{ matrix.job }}
          artifact: store-gate-more-${{ matrix.job }}
          out: job-${{ matrix.job }}-more.json
          from: "12"
          cases: ${{ needs.mongo-speed-look.outputs.more }}

  mongo-speed-verdict:
    name: MongoDB (the verdict of the speed gate)
    needs: [mongo-speed-plan, mongo-speed, mongo-speed-look, mongo-speed-more]
    if: ${{ !cancelled() && needs.mongo-speed-plan.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/store-gate-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: store-gate-job-*
          merge-multiple: true
          path: packages/client-mongo/bench-out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: store-gate-more-*
          merge-multiple: true
          path: packages/client-mongo/bench-out
      # A rerun is a further look that the level does not count. So the text states the attempt, and the
      # name of the artifact keeps it, for the count of the reruns of each pull request.
      - name: The verdict
        working-directory: packages/client-mongo
        env:
          RUN: ${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          status=0
          node --import tsx bench/gate-report.ts --jobs bench-out --out gate-report.json --run "$RUN" --pr "$PR" --enforce || status=$?
          { echo '```json'; cat gate-report.json || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 2 ]; then echo "::error title=The speed gate has no read::$(jq -r .text gate-report.json)"; fi
          if [ "$status" = 1 ]; then echo "::error title=The speed gate blocks this change::$(jq -r .text gate-report.json)"; fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: store-gate-report-attempt-${{ github.run_attempt }}
          path: |
            packages/client-mongo/bench-out/
            packages/client-mongo/gate-report.json
          if-no-files-found: warn

  site:
    name: Site (browser smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Read access only: the status page reads the open pull requests and issues of the repository
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history and the tags: the Releases section of the status page reads the date
          # of each version from git, as the Pages workflow does
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium first: the site build prerenders each page in it, so the tests see the real HTML
      - name: Install Chromium for Playwright
        run: pnpm --filter @procedures/site exec playwright install --with-deps chromium
      # GITHUB_TOKEN: the status page reads GitHub as the Pages build does. Without it (a fork),
      # the page says that the build could not read GitHub, and the tests pass too.
      - run: pnpm build
        env:
          SITE_PRERENDER: "1"
          GITHUB_TOKEN: ${{ github.token }}
      # The examples run, share links round-trip, no page scrolls sideways at 375 px, axe-core,
      # the keyboard, and the code of the TypeScript tab runs with Node
      - run: pnpm --filter @procedures/site test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: packages/site/node_modules/.cache/playwright/results
          retention-days: 7

  # The one check that the ruleset of main names (template CI.md, "The check of the ruleset").
  # It needs each job of the merge gate, starts also after a failure, and fails when one of them
  # did not pass. Only a job that ALLOW_SKIP names can be skipped (changesets skips on a push).
  # Add each new job of the gate to `needs`, and to ALLOW_SKIP when its own `if` can skip it.
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci, changesets, checks, mongo, mongo-speed-plan, mongo-speed, mongo-speed-look, mongo-speed-more, mongo-speed-verdict, site]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: "changesets mongo-speed-plan mongo-speed mongo-speed-look mongo-speed-more mongo-speed-verdict"
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
