name: Stream cost

# The connections, the idle getMore commands and the time to ready of the materialized views at the
# rungs of bench/stream-cases.ts, before and after a change of materializer.ts (roadmap CLI-92). The input
# `base` is the commit of the arm before, and the checked-out ref is the arm after. Each sample is a
# fresh process against a real MongoDB. The report pools the jobs.
#
# The input `suite` selects the bench. The suite `read` gives the reads per second of a burst of
# change reads, first read and delta read, of document-storage.ts (roadmap CLI-91). The suite `read-bound`
# pairs the change reads of the arms at a stated delay, and gates its objective at that delay. The suite
# `write` gives the cost of the queue of a burst of writes. The suite `gate` is the speed gate of the store
# (roadmap CLI-94): CI runs it on each change of the store, and a dispatch gives the runs of its limit.
# The suite `views` starts 1,000 views with a pipeline text for each partition. The suite `tenant`
# gives an open-loop load of tenants in one collection against the first guess of the ladder (roadmap
# CLI-95). The suite `tenant-ceiling` tells a limit of that collection from a limit of the runner, with
# MongoDB and the writers on all processors and apart. The suite `tenant-separate` tells the queue of a
# process from the counter document and from the disk. The suite `tenant-first` adds first loads of new tenants.
# The suite `tenant-partition` is the gate of a counter and a write queue for each partition (roadmap CLI-96).
#
# Only a dispatch starts the workflow, and no ruleset needs its checks. It only reports, except for the
# objective of the suite `read-bound` and the suite `gate` with `enforce`.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: The bench that this run starts.
        type: choice
        options:
          - stream
          - read
          - read-bound
          - write
          - gate
          - views
          - tenant
          - tenant-ceiling
          - tenant-separate
          - tenant-first
          - tenant-partition
        default: stream
      enforce:
        description: The suite gate fails the run when a case is not within its limit.
        type: boolean
        default: false
      prediction:
        description: The id of the prediction that this run scores.
        required: true
        type: string
      base:
        description: The commit of the arm before.
        required: true
        type: string
      runs:
        description: The jobs, from 1 to 9. Five or more for a limit.
        type: string
        default: "5"
      rounds:
        description: The rounds of each job.
        type: string
        default: "3"
      cap_seconds:
        description: The longest start and the longest burst of one child.
        type: string
        default: "90"
      base_arm:
        description: The arm of each pair of the suite read-bound. With after, the arm before starts one time for each case and round.
        type: choice
        options:
          - before
          - after
        default: before
      mongo_delay_ms:
        description: The time that each request to MongoDB waits, for a read of a remote server. The value 0 adds no wait.
        type: string
        default: "0"
      case:
        description: One case of a tenant suite, or all. Each case of a tenant suite has its own CI job.
        type: string
        default: all
      server_samples:
        description: Each tenant arm reads the server each second, for a probe (CLI-96). The readings add a little load.
        type: boolean
        default: false
      writes_in_flight:
        description: The option writesInFlight of the tenant stores, for a sweep (CLI-96). Empty keeps the default of the store.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false

# Each step runs in bash with pipefail, so a failure on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
      cases: ${{ steps.plan.outputs.cases }}
    steps:
      # The plan reads the cases of a tenant suite from bench/tenant-cases.ts. That file has no imports, so it needs no install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Plan the jobs
        id: plan
        env:
          SUITE: ${{ inputs.suite }}
          CASE: ${{ inputs.case }}
          RUNS: ${{ inputs.runs }}
          ROUNDS: ${{ inputs.rounds }}
          CAP: ${{ inputs.cap_seconds }}
          BASE: ${{ inputs.base }}
          DELAY: ${{ inputs.mongo_delay_ms }}
          WRITES_IN_FLIGHT: ${{ inputs.writes_in_flight }}
        run: |
          [[ -z "$WRITES_IN_FLIGHT" || "$WRITES_IN_FLIGHT" =~ ^([1-9][0-9]{0,3}|Infinity)$ ]] || { echo "writes_in_flight must be empty, a number from 1 to 9999, or Infinity, not $WRITES_IN_FLIGHT"; exit 1; }
          [[ "$DELAY" =~ ^[0-9]{1,3}$ ]] || { echo "mongo_delay_ms must be a number from 0 to 999, not $DELAY"; exit 1; }
          [[ "$RUNS" =~ ^[1-9]$ ]] || { echo "runs must be a number from 1 to 9, not $RUNS"; exit 1; }
          [[ "$ROUNDS" =~ ^[1-9][0-9]?$ ]] || { echo "rounds must be a number from 1 to 99, not $ROUNDS"; exit 1; }
          [[ "$CAP" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "cap_seconds must be a number from 1 to 999, not $CAP"; exit 1; }
          [[ "$BASE" =~ ^[0-9a-f]{7,40}$ ]] || { echo "base must be a commit, not $BASE"; exit 1; }
          echo "runs=[$(seq -s, 1 "$RUNS")]" >> "$GITHUB_OUTPUT"
          # Each case of a tenant suite has its own CI job, so a slow rung does not hold the job of the other rungs (CLI-96).
          if [[ "$SUITE" == tenant* ]]; then
            cases=$(node -e '
              const [file, suite, only] = process.argv.slice(1);
              import(require("node:url").pathToFileURL(file).href).then(({ SUITE_CASES }) => {
                const all = SUITE_CASES[suite];
                if (!all) throw new Error(`bench/tenant-cases.ts has no cases for the suite ${suite}`);
                if (only !== "all" && !all.includes(only)) throw new Error(`the suite ${suite} has no case ${only}: ${all.join(", ")}`);
                console.log(JSON.stringify(only === "all" ? all : [only]));
              });
            ' packages/client-mongo/bench/tenant-cases.ts "$SUITE" "$CASE")
          else
            [ "$CASE" = all ] || { echo "the input case is only for a tenant suite, not $SUITE"; exit 1; }
            cases='["all"]'
          fi
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: stream cost (job ${{ matrix.job }}${{ matrix.case != 'all' && format(', {0}', matrix.case) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(inputs.suite, 'tenant') && 90 || 60 }}
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.runs) }}
        case: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter mark1russell7-monorepo --filter "@procedures/mongo..."
      - run: pnpm --filter "@procedures/mongo^..." run build
      - name: Write the arm before
        env:
          BASE: ${{ inputs.base }}
        run: |
          git show "$BASE:packages/client-mongo/src/storage/materializer.ts" > packages/client-mongo/src/storage/materializer.base.ts
          mkdir packages/client-mongo/base
          git archive "$BASE" packages/client-mongo/src | tar -x --strip-components=2 -C packages/client-mongo/base
      - uses: ./.github/actions/start-mongo
      - name: Start a second MongoDB 7 with its files in memory
        if: inputs.suite == 'tenant-separate'
        uses: ./.github/actions/start-mongo
        with:
          name: mongo-tmpfs
          port: "27018"
          memory-files: "1"
      - name: Test the rules of the tenant bench
        if: startsWith(inputs.suite, 'tenant')
        working-directory: packages/client-mongo
        run: node node_modules/vitest/vitest.mjs run bench/tenant-reading.test.ts bench/tenant-cases.test.ts bench/tenant-copies.test.ts bench/tenant-jobs.test.ts bench/tenant-server.test.ts bench/tenant-spread.test.ts
      - name: Hold the stated delay on the connection to MongoDB
        if: ${{ inputs.mongo_delay_ms != '0' }}
        env:
          DELAY: ${{ inputs.mongo_delay_ms }}
        run: |
          sudo modprobe sch_netem || { sudo apt-get update -q; sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"; sudo modprobe sch_netem; }
          sudo tc qdisc add dev docker0 root netem delay "${DELAY}ms"
          tc qdisc show dev docker0
      - name: Run the job
        working-directory: packages/client-mongo
        env:
          JOB: ${{ matrix.job }}
          CASE: ${{ matrix.case }}
          TENANT_SERVER_SAMPLES: ${{ inputs.server_samples && '1' || '' }}
          TENANT_WRITES_IN_FLIGHT: ${{ inputs.writes_in_flight }}
          BASE_ARM: ${{ inputs.suite == 'read-bound' && inputs.base_arm || '' }}
          ROUNDS: ${{ inputs.rounds }}
          CAP: ${{ inputs.cap_seconds }}
          SUITE: ${{ inputs.suite }}
          MONGO_TEST_URL: mongodb://localhost:27017/?directConnection=true
          MONGO_CONTAINER: ${{ inputs.suite == 'tenant-ceiling' && 'mongo' || '' }}
          MONGO_TMPFS_URL: mongodb://localhost:27018/?directConnection=true
        run: |
          if [ "$CASE" = all ]; then out="bench-out/job-$JOB.json"; only=(); else out="bench-out/job-$JOB-$CASE.json"; only=(--case "$CASE"); fi
          node --import tsx "bench/$SUITE-run.ts" --job "$JOB" --rounds "$ROUNDS" --cap "$CAP" --out "$out" "${only[@]}" ${BASE_ARM:+--base "$BASE_ARM"}
      # A failed job also keeps its records: the rounds that ended before the failure are a reading too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: stream-cost-job-${{ matrix.job }}${{ matrix.case != 'all' && format('-{0}', matrix.case) || '' }}
          path: packages/client-mongo/bench-out/
          if-no-files-found: error

  report:
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter mark1russell7-monorepo --filter "@procedures/mongo..."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stream-cost-job-*
          merge-multiple: true
          path: packages/client-mongo/bench-out
      - name: Pool the jobs
        id: pool
        working-directory: packages/client-mongo
        env:
          RUN: ${{ github.run_id }}
          PREDICTION: ${{ inputs.prediction }}
          SUITE: ${{ inputs.suite }}
          ENFORCE: ${{ inputs.suite == 'gate' && inputs.enforce && '--enforce' || '' }}
          # The suite read-bound gates its objective at one delay (roadmap CLI-91)
          DELAY: ${{ inputs.suite == 'read-bound' && inputs.mongo_delay_ms || '' }}
        run: |
          # The upload below keeps the report of a failed verdict
          status=0
          node --import tsx "bench/$SUITE-report.ts" --jobs bench-out --out "$SUITE-report.json" --run "$RUN" $ENFORCE ${DELAY:+--delay "$DELAY"} || status=$?
          { echo "Prediction: $PREDICTION"; echo '```json'; cat "$SUITE-report.json" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.suite }}-cost-report
          path: packages/client-mongo/${{ inputs.suite }}-report.json
          if-no-files-found: warn
      - name: The verdict
        env:
          STATUS: ${{ steps.pool.outputs.status }}
        run: exit "$STATUS"
