name: One job of the store gate
description: This action compares the store with its base on MongoDB 7 and uploads the records of the job.

inputs:
  job:
    description: The number of the job. The verdict needs the bound in each job.
    required: true
  artifact:
    description: The name of the artifact that takes the records.
    required: true
  out:
    description: The file of the records, in the folder bench-out.
    required: true
  from:
    description: The first round of this look, after the rounds of the earlier looks.
    default: "0"
  cases:
    description: The cases of this look, separated by commas. The first look has all cases when this is empty.
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/start-mongo
    - uses: ./.github/actions/store-gate-tools
    - shell: bash
      run: pnpm --filter "@procedures/mongo^..." run build
    # HEAD is the merge of the pull request, and its first parent is the base of that merge
    - name: Write the arm before
      shell: bash
      run: |
        mkdir packages/client-mongo/base
        git archive HEAD^1 packages/client-mongo/src | tar -x --strip-components=2 -C packages/client-mongo/base
    - name: Compare the store with its base
      shell: bash
      working-directory: packages/client-mongo
      env:
        MONGO_TEST_URL: mongodb://localhost:27017/?directConnection=true
        JOB: ${{ inputs.job }}
        FROM: ${{ inputs.from }}
        CASES: ${{ inputs.cases }}
        OUT: ${{ inputs.out }}
      run: |
        chosen=()
        if [ -n "$CASES" ]; then chosen=(--cases "$CASES"); fi
        node --import tsx bench/gate-run.ts --job "$JOB" --rounds 12 --cap 120 --from "$FROM" "${chosen[@]}" --out "bench-out/$OUT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: ${{ inputs.artifact }}
        path: packages/client-mongo/bench-out/
        if-no-files-found: warn
