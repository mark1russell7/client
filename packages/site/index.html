<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>client: procedures as data</title>
    <meta
      name="description"
      content="The client ecosystem: one procedure registry for the CLI, the MCP server, HTTP and WebSocket. Compose procedures as data and run them in the browser."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // The theme of the reader: the selection in the header, else the system preference
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
